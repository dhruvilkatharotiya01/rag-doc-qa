name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.15,<0.16"
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Evaluation report
        run: |
          python -m ragqa.cli --index index ingest data/sample
          python -m ragqa.cli --index index eval eval/questions.jsonl
          python -m ragqa.cli benchmark data/sample eval/questions.jsonl >> "$GITHUB_STEP_SUMMARY"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ragqa .
      - name: Smoke test
        run: |
          docker run -d -p 8000:8000 --name ragqa ragqa
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf -X POST localhost:8000/ask -H 'Content-Type: application/json' \
            -d '{"question": "What is time-to-collision?"}' | tee /dev/stderr | grep -q '"abstained":false'
