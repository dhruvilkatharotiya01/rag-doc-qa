[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragqa"
version = "0.2.0"
description = "A small, transparent retrieval-augmented question answering system with citations, abstention and built-in evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Dhruvil Katharotiya" }]
keywords = ["rag", "retrieval-augmented-generation", "question-answering", "bm25", "llm", "evaluation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "pypdf>=3.17",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.15,<0.16"]
sbert = ["sentence-transformers>=2.7"]

[project.scripts]
ragqa = "ragqa.cli:main"

[tool.setuptools]
packages = ["ragqa"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
